limit_req_zone $binary_remote_addr zone=cinema_api:10m rate=5r/s;
server {
    listen 80;
    server_name compute-alt.r0h.in play.r0h.in;
    client_max_body_size 32k;
    location / {
        limit_req zone=cinema_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        access_log off;
    }
}
